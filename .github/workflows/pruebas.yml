name: Pruebas Java y cobertura

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Preparar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Compilar, ejecutar pruebas y medir cobertura
        run: bash ./mvnw -B -ntp clean verify
      - name: Conservar resultados de esta ejecucion
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pruebas-${{ github.sha }}
          retention-days: 30
          if-no-files-found: warn
          path: |
            target/surefire-reports/
            target/site/jacoco/
            target/pruebas-api/
