spring.application.name=comparaprecios
server.port=8080

# --- Fuentes externas ---
oece.base-url=https://contratacionesabiertas.oece.gob.pe
oece.source=seace_v3
oece.max-paginas=30
oece.hilos-detalle=6

bcrp.base-url=https://estadisticas.bcrp.gob.pe/estadisticas/series/api
bcrp.serie-ipc=PN38705PM
bcrp.serie-tc=PN01207PM

# Tiempos de espera (ms) y reintentos para las llamadas HTTP
http.connect-timeout=5000
http.read-timeout=15000
http.reintentos=2

# --- Persistencia (H2 en memoria para desarrollo) ---
spring.datasource.url=jdbc:h2:mem:comparaprecios
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=true
