# Ejecutar con: mvn spring-boot:run -Dspring-boot.run.profiles=postgres
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/comparaprecios}
spring.datasource.username=${DB_USER:postgres}
